<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live — dein.art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>(function (r) { r.dataset.theme = "light"; r.dataset.side = "closed"; try { r.dataset.theme = localStorage.getItem("theme") || "light"; if (innerWidth >= 1100) r.dataset.side = localStorage.getItem("side") || "open"; } catch (e) {} })(document.documentElement);</script>
</head>
<body data-page="live">
<main class="wrap">
  <div class="watch">
    <div>
      <div class="stage"><img class="glow" alt="">
      <div class="player">
        <video data-f-video controls preload="none" playsinline></video>
        <span class="pill live">● LIVE</span>
      </div></div>
      <h1 data-f="title"></h1>
      <div class="byline" data-f="byline"></div>
      <div class="box" data-f="about"></div>
      <div class="cast" data-cast></div>
    </div>

    <aside class="chat">
      <header>Live chat</header>
      <div class="msgs"></div>
      <form><input placeholder="Say something" aria-label="Chat message"><button class="btn dark">Send</button></form>
    </aside>
  </div>

  <div class="sec"><h2>Also live</h2></div>
  <div class="grid" data-list="live" data-skip="1"></div>
</main>
<dialog id="crew" class="wide">
  <h2>Cast and crew</h2>
  <p class="muted small" style="margin:4px 0 16px">Everything this film earns — support, marketplace, merch — is split between these people automatically, the moment it comes in.</p>
  <div data-crew></div>
  <button class="btn wide" data-close style="margin-top:18px">Close</button>
</dialog>
<script src="assets/catalog.js"></script>
<script src="assets/onchain.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
