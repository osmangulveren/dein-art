<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketplace — dein.art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>(function (r) { r.dataset.theme = "light"; r.dataset.side = "closed"; try { r.dataset.theme = localStorage.getItem("theme") || "light"; if (innerWidth >= 1100) r.dataset.side = localStorage.getItem("side") || "open"; } catch (e) {} })(document.documentElement);</script>
</head>
<body data-page="market">
<main class="wrap">
  <div class="page-head">
    <h1>Marketplace</h1>
    <p>Everything creators share and offer, in one place: footage, music, sound effects, photos, templates for your editor, and merch. Free things download straight away; what you pay for goes to the people who made it, minus a flat $1.</p>
  </div>
  <div class="shopbar">
    <form class="search" onsubmit="return false"><input data-shop="q" placeholder="Search the marketplace" aria-label="Search the marketplace"></form>
    <div class="chips" data-shop="price"></div>
    <label class="shopcheck"><input type="checkbox" data-shop="film"> Linked to a film</label>
    <select class="field" data-shop="sort" aria-label="Sort"><option value="featured">Featured</option><option value="az">A to Z</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select>
  </div>
  <div class="shop">
    <nav class="shopcats" data-shop="cats" aria-label="Categories"></nav>
    <div>
      <p class="muted small" data-shop="count"></p>
      <div class="grid" data-shop="grid"></div>
      <div class="more" data-shop="more" hidden><button class="btn">Show more</button></div>
    </div>
  </div>
</main>
<script src="assets/ui.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/onchain.js"></script>
<script src="assets/founder.js"></script>
<script src="assets/studios.js"></script>
<script src="assets/assets.js"></script>
<script src="assets/market.js"></script>
<script src="assets/app.js"></script>
<script src="assets/search.js"></script>
<script src="assets/login.js"></script>
<script src="assets/shop.js"></script>
</body>
</html>
