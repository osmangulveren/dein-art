<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist — dein.art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>(function (r) { r.dataset.theme = "light"; r.dataset.side = "closed"; try { r.dataset.theme = localStorage.getItem("theme") || "light"; if (innerWidth >= 1100) r.dataset.side = localStorage.getItem("side") || "open"; } catch (e) {} })(document.documentElement);</script>
</head>
<body data-page="artist">
<main class="wrap">
  <section class="profile">
    <div data-p="avatar"></div>
    <div class="about">
      <h1 data-p="name"></h1>
      <p class="muted" data-p="line"></p>
      <p class="bio" data-p="bio"></p>
      <p style="margin-top:14px;display:flex;gap:8px" data-p="acts"></p>
      <p class="links" data-p="links"></p>
    </div>
    <div data-p="side"></div>
  </section>

  <section class="details">
    <div class="panel"><h3 data-p="factstitle"></h3><dl class="facts" data-p="facts"></dl></div>
    <div class="panel" data-p="withpanel"><h3>Worked with</h3><div class="withrow" data-p="with"></div></div>
  </section>

  <section class="claim" data-w="claim" aria-live="polite"></section>

  <div class="tabs">
    <button class="tab on" data-tab="videos">Videos</button>
    <button class="tab" data-tab="credits">Credits</button>
    <button class="tab" data-tab="live">Live</button>
    <button class="tab" data-tab="assets">Assets</button>
    <button class="tab" data-tab="collections" data-chain-only hidden>NFT collections</button>
    <button class="tab" data-tab="wallet" data-chain-only hidden>In wallet</button>
    <button class="tab" data-tab="merch">Merch</button>
    <button class="tab" data-tab="funding">Funding</button>
  </div>

  <div class="grid" data-panel="videos" data-list="films" data-by="@subject" data-empty="No videos here yet."></div>
  <div data-panel="credits" hidden>
    <div data-has-credits>
      <div class="sec" style="margin-top:0"><h2>Known for</h2></div>
      <div class="known" data-known></div>
      <div class="sec"><h2>Credits</h2><p data-credit-count></p></div>
      <div data-credits></div>
    </div>
    <p class="muted small" style="margin-top:14px" data-p="creditnote"></p>
  </div>
  <div class="grid" data-panel="live" data-list="live" data-by="@subject" data-empty="Not live right now." hidden></div>
  <div class="grid" data-panel="assets" data-list="assets" data-by="@subject" data-empty="No assets shared yet." hidden></div>
  <div data-panel="collections" hidden>
    <div class="sec" style="margin-top:0"><h2>NFT collections</h2><p data-w="count"></p></div>
    <div data-w="collections"></div>
  </div>
  <div data-panel="wallet" hidden>
    <div class="sec" style="margin-top:0"><h2>In this wallet</h2><p data-nft="count"></p></div>
    <p class="muted small" data-nft="note"></p>
    <div data-nft="list"></div>
    <div class="more" data-nft="more" hidden><button class="btn">Load more</button></div>
  </div>
  <div class="merchgrid" data-panel="merch" data-merch hidden></div>
  <div class="grid c3" data-panel="funding" data-list="campaigns" data-by="@subject" data-empty="No project is funding right now." hidden></div>
</main>
<script src="assets/ui.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/onchain.js"></script>
<script src="assets/founder.js"></script>
<script src="assets/studios.js"></script>
<script src="assets/assets.js"></script>
<script src="assets/market.js"></script>
<script src="assets/app.js"></script>
<script src="assets/search.js"></script>
<script src="assets/login.js"></script>
<script src="assets/edit.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
<script src="assets/claims-contract.js"></script>
<script src="assets/claim.js"></script>
<script src="assets/wallet-nfts.js"></script>
</body>
</html>
