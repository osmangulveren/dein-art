<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist — dein.art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>(function (r) { r.dataset.theme = "light"; r.dataset.side = "closed"; try { r.dataset.theme = localStorage.getItem("theme") || "light"; if (innerWidth >= 1100) r.dataset.side = localStorage.getItem("side") || "open"; } catch (e) {} })(document.documentElement);</script>
</head>
<body data-page="artist">
<main class="wrap person-page">
  <header class="person-head">
    <div>
      <h1 data-artist="name"></h1>
      <p class="muted" data-artist="line"></p>
    </div>
    <a class="pop" href="trending.html#artists"><span class="muted small">Trending</span><b>#<span data-artist="rank"></span></b><span class="up">▲ <span data-artist="up"></span>%</span></a>
  </header>

  <section class="person-top">
    <div class="portrait" data-artist="portrait"></div>
    <div class="stage"><img class="glow" alt="">
      <div class="player">
        <video controls preload="none" playsinline></video>
        <span class="pill" data-artist="reel"></span>
      </div>
    </div>
    <div class="tiles" data-artist="tiles"></div>
  </section>

  <div class="person-body">
    <div>
      <p class="lead" data-artist="lead"></p>
      <p style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn follow">Follow</button><button class="btn">Share</button></p>

      <div class="sec" id="known"><h2>Known for</h2></div>
      <div class="known" data-known></div>

      <div class="sec" id="credits"><h2>Credits</h2><p data-credit-count></p></div>
      <div data-credits></div>
      <p class="muted small" style="margin-top:14px">Credits come from Wikidata. On dein.art they are added when a film is published and its crew is listed, so every cast and crew member builds a page like this one.</p>

      <div class="sec" id="photos"><h2>Stills</h2></div>
      <div class="photos" data-artist="stills"></div>
    </div>

    <aside class="person-side">
      <div class="panel">
        <h3>Personal details</h3>
        <dl class="facts" data-artist="facts"></dl>
      </div>
      <div class="panel">
        <h3>Worked with</h3>
        <div class="castlist-v" data-artist="with"></div>
      </div>
    </aside>
  </div>
</main>
<script src="assets/catalog.js"></script>
<script src="assets/onchain.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
