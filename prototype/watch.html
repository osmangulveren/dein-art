<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch — dein.art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>(function (r) { r.dataset.theme = "light"; r.dataset.side = "closed"; try { r.dataset.theme = localStorage.getItem("theme") || "light"; if (innerWidth >= 1100) r.dataset.side = localStorage.getItem("side") || "open"; } catch (e) {} })(document.documentElement);</script>
</head>
<body data-page="watch">
<main class="wrap watch">
  <div class="watchmain">
    <div class="stage"><img class="glow" alt="">
    <div class="player">
      <video data-f-video controls preload="none" playsinline></video>
      <button class="play" aria-label="Play">▶</button>
      <div class="endcard" data-endcard hidden></div>
    </div></div>
    <div class="chapters" data-chapters aria-label="Scenes"></div>

    <header class="filmhead">
      <h1 data-f="title"></h1>
      <p class="filmmeta" data-f="meta"></p>
      <div class="filmacts">
        <div class="byline" data-f="byline"></div>
        <div class="acts" data-f="acts"></div>
      </div>
    </header>

    <div class="filmbody">
      <section class="panel" data-f="about"></section>
      <section class="panel splitcard" data-f="split"></section>
    </div>

    <section class="block slideblock">
      <div class="sec"><h2>Cast and crew</h2><a href="#crew">Roles and shares</a></div>
      <div class="grid crewcards crewrow" data-cast data-slider></div>
    </section>

    <section class="block slideblock" data-fromfilm hidden>
      <div class="sec"><h2>From this film</h2><a data-fromfilm-all href="market.html">In the marketplace</a></div>
      <div class="grid" data-fromfilm-list data-slider></div>
    </section>

    <section class="block slideblock">
      <div class="sec"><h2 data-f="related">Related</h2></div>
      <div class="grid" data-list="related" data-card="films" data-slider></div>
    </section>

    <section class="block" id="reviews">
      <div class="sec"><h2>Reviews</h2><p data-review-avg></p></div>
      <form class="reviewbox" data-review-form>
        <div class="stars" data-stars role="radiogroup" aria-label="Your rating"></div>
        <textarea class="field" rows="2" placeholder="What did you think of it?" aria-label="Your review"></textarea>
        <button class="btn dark">Publish</button>
      </form>
      <div class="reviews" data-reviews></div>
    </section>
  </div>

  <aside class="side">
    <div class="uphead"><h2>Up next</h2><label class="autonext"><span>Autoplay</span><span data-autonext></span></label></div>
    <div data-list="related films" data-card="next" data-limit="8"></div>
    <p class="keys muted small"><b>Keys</b> <kbd>space</kbd> play · <kbd>←</kbd><kbd>→</kbd> 5 s · <kbd>J</kbd><kbd>L</kbd> 10 s · <kbd>M</kbd> mute · <kbd>F</kbd> full screen · <kbd>C</kbd> cinematic · <kbd>N</kbd> next</p>
  </aside>
</main>
<dialog id="crew" class="crewpop"><div data-crew></div></dialog>
<script src="assets/ui.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/onchain.js"></script>
<script src="assets/founder.js"></script>
<script src="assets/studios.js"></script>
<script src="assets/assets.js"></script>
<script src="assets/market.js"></script>
<script src="films/index.js"></script>
<script src="assets/films.js"></script>
<script src="assets/app.js"></script>
<script src="assets/search.js"></script>
<script src="assets/login.js"></script>
<script src="assets/splits-contract.js"></script>
<script src="assets/chainpay.js"></script>
</body>
</html>
