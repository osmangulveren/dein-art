<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch — dein.art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>(function (r) { r.dataset.theme = "light"; r.dataset.side = "closed"; try { r.dataset.theme = localStorage.getItem("theme") || "light"; if (innerWidth >= 1100) r.dataset.side = localStorage.getItem("side") || "open"; } catch (e) {} })(document.documentElement);</script>
</head>
<body data-page="watch">
<main class="wrap watch">
  <div>
    <div class="stage"><img class="glow" alt="">
    <div class="player">
      <video data-f-video controls preload="none" playsinline></video>
      <button class="play" aria-label="Play">▶</button>
    </div></div>
    <div class="track" data-marks title="Scenes are marked on the timeline"><span></span></div>
    <div class="scenecard" data-scene></div>
    <div class="proof" data-f="proof"></div>
    <h1 data-f="title"></h1>
    <div class="byline" data-f="byline"></div>
    <div class="box" data-f="about"></div>
    <div class="cast" data-cast></div>

    <section class="block">
      <h2 data-f="related">Related</h2>
      <div class="grid" data-list="related" data-card="films"></div>
    </section>

    <section class="block" id="reviews">
      <h2>Reviews</h2>
      <form class="review-form"><input placeholder="Add a review" aria-label="Add a review"><button class="btn dark">Publish</button></form>
      <div class="reviews" data-reviews><p class="muted" data-noreviews>No reviews yet. Be the first.</p></div>
    </section>
  </div>

  <aside class="side">
    <h2>Up next</h2>
    <div data-list="films" data-card="next" data-limit="6"></div>
  </aside>
</main>
<dialog id="crew" class="wide">
  <h2>Cast and crew</h2>
  <p class="muted small" style="margin:4px 0 16px">Everything this film earns — support, marketplace, merch — is split between these people automatically, the moment it comes in.</p>
  <div data-crew></div>
  <button class="btn wide" data-close style="margin-top:18px">Close</button>
</dialog>
<script src="assets/catalog.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
