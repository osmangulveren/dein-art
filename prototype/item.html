<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item — dein.art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif&family=Montserrat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>(function (r) { r.dataset.theme = "light"; r.dataset.side = "closed"; try { r.dataset.theme = localStorage.getItem("theme") || "light"; if (innerWidth >= 1100) r.dataset.side = localStorage.getItem("side") || "open"; } catch (e) {} })(document.documentElement);</script>
</head>
<body data-page="market">
<main class="wrap">
  <p class="crumbs" data-i="crumbs"></p>
  <section class="itempage">
    <div class="itemmedia" data-i="media"></div>
    <aside class="itemside">
      <span class="pill tint" data-i="kind"></span>
      <h1 data-i="title"></h1>
      <div class="byline" data-i="by"></div>
      <div class="itemprice" data-i="price"></div>
      <div data-i="options"></div>
      <div class="itemacts" data-i="acts"></div>
      <p class="muted small" data-i="note"></p>
      <dl class="facts" data-i="facts"></dl>
      <div class="traits" data-i="works"></div>
    </aside>
  </section>
  <section class="itembody">
    <div>
      <div data-i="desc"></div>
      <div data-i="contents"></div>
      <div data-i="files"></div>
      <div data-i="own"></div>
    </div>
    <div data-i="film"></div>
  </section>
  <div data-i="more"></div>
</main>
<script src="assets/ui.js"></script>
<script src="assets/catalog.js"></script>
<script src="assets/onchain.js"></script>

</html>
